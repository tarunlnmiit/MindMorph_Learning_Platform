name: tests

on:
  push:
    branches: [main]   # branch pushes are covered by the pull_request event; this avoids double runs
  pull_request:

# Both suites are hermetic by design: no LLM key, no Ollama daemon, no Postgres, no network.
# The env below asserts that on purpose — a regression that reaches for a real service fails here
# instead of passing quietly on a developer machine that happens to have one running.
env:
  GROQ_API_KEYS: ""                          # hosted lane off; app falls back to local Ollama
  MINDMORPH_OLLAMA_HOST: http://127.0.0.1:1  # closed loopback port: refuses instantly, never hangs
  MINDMORPH_STORE: memory                    # in-memory repository, no DB
  # DATABASE_URL left unset. config.py defaults to localhost:5432, which refuses immediately, so the
  # two Postgres-gated test modules skip at collection without stalling.

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `npm run dev` itself; Next compiles routes on demand, and a cold
      # compile costs ~12s locally and more on a shared runner. --timeout raises the per-test budget
      # (default 30s) without editing the config. Building first would not help: webServer always
      # runs the dev server.
      - run: npx playwright test --timeout=60000
